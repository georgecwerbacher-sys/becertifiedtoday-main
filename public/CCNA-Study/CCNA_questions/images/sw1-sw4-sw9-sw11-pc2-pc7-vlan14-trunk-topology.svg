<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">VLAN 14 trunk topology between SW4 and SW9</title>
  <desc id="desc">SW1, SW4, SW9, and SW11 form an inter-switch topology. PC2 and PC7 are in VLAN 14; PC3 and PC9 are in VLAN 108.</desc>
  <rect width="900" height="430" fill="#f8fafc"/>
  <style>
    .sw{fill:#1d4ed8;stroke:#0f172a;stroke-width:2}
    .pc14{fill:#16a34a;stroke:#0f172a;stroke-width:2}
    .pc108{fill:#f59e0b;stroke:#0f172a;stroke-width:2}
    .link{stroke:#334155;stroke-width:4}
    .trunk{stroke:#7c3aed;stroke-width:5;stroke-dasharray:9 7}
    .label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-family:Arial,sans-serif;font-size:15px;fill:#334155}
  </style>
  <rect class="sw" x="390" y="40" width="120" height="70" rx="14"/>
  <text class="label" x="450" y="83" text-anchor="middle" fill="#fff">SW1</text>
  <rect class="sw" x="165" y="175" width="120" height="70" rx="14"/>
  <text class="label" x="225" y="218" text-anchor="middle" fill="#fff">SW4</text>
  <rect class="sw" x="615" y="175" width="120" height="70" rx="14"/>
  <text class="label" x="675" y="218" text-anchor="middle" fill="#fff">SW9</text>
  <rect class="sw" x="390" y="300" width="120" height="70" rx="14"/>
  <text class="label" x="450" y="343" text-anchor="middle" fill="#fff">SW11</text>
  <line class="link" x1="390" y1="90" x2="285" y2="185"/>
  <line class="link" x1="510" y1="90" x2="615" y2="185"/>
  <line class="trunk" x1="285" y1="210" x2="615" y2="210"/>
  <text class="sub" x="450" y="198" text-anchor="middle">Configure trunk: carry VLAN 14 without disrupting VLAN 108</text>
  <line class="link" x1="285" y1="235" x2="390" y2="320"/>
  <line class="link" x1="615" y1="235" x2="510" y2="320"/>
  <rect class="pc14" x="65" y="135" width="92" height="48" rx="10"/>
  <text class="label" x="111" y="166" text-anchor="middle" fill="#fff">PC2</text>
  <text class="sub" x="111" y="204" text-anchor="middle">VLAN 14</text>
  <line class="link" x1="157" y1="160" x2="165" y2="185"/>
  <rect class="pc108" x="65" y="245" width="92" height="48" rx="10"/>
  <text class="label" x="111" y="276" text-anchor="middle">PC3</text>
  <text class="sub" x="111" y="314" text-anchor="middle">VLAN 108</text>
  <line class="link" x1="157" y1="268" x2="165" y2="235"/>
  <rect class="pc14" x="743" y="135" width="92" height="48" rx="10"/>
  <text class="label" x="789" y="166" text-anchor="middle" fill="#fff">PC7</text>
  <text class="sub" x="789" y="204" text-anchor="middle">VLAN 14</text>
  <line class="link" x1="735" y1="185" x2="743" y2="160"/>
  <rect class="pc108" x="743" y="245" width="92" height="48" rx="10"/>
  <text class="label" x="789" y="276" text-anchor="middle">PC9</text>
  <text class="sub" x="789" y="314" text-anchor="middle">VLAN 108</text>
  <line class="link" x1="735" y1="235" x2="743" y2="268"/>
</svg>
