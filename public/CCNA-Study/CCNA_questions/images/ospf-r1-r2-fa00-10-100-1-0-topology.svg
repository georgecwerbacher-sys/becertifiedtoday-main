<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">R1 to R2 OSPF FastEthernet0/0 topology</title>
  <desc id="desc">R1 FastEthernet0/0 connects to R2 FastEthernet0/0 on network 10.100.1.0. R1 is 10.100.1.1 and R2 is 10.100.1.2.</desc>
  <rect width="900" height="360" fill="#f8fafc"/>
  <style>
    .router{fill:#1d4ed8;stroke:#0f172a;stroke-width:2}
    .link{stroke:#334155;stroke-width:5}
    .label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}
    .sub{font-family:Arial,sans-serif;font-size:16px;fill:#334155}
  </style>
  <circle class="router" cx="235" cy="175" r="58"/>
  <text class="label" x="235" y="182" text-anchor="middle" fill="#fff">R1</text>
  <circle class="router" cx="665" cy="175" r="58"/>
  <text class="label" x="665" y="182" text-anchor="middle" fill="#fff">R2</text>
  <line class="link" x1="293" y1="175" x2="607" y2="175"/>
  <text class="label" x="450" y="132" text-anchor="middle">10.100.1.0/24</text>
  <text class="sub" x="340" y="205" text-anchor="middle">Fa0/0</text>
  <text class="sub" x="560" y="205" text-anchor="middle">Fa0/0</text>
  <text class="sub" x="235" y="255" text-anchor="middle">10.100.1.1</text>
  <text class="sub" x="665" y="255" text-anchor="middle">10.100.1.2</text>
  <text class="sub" x="450" y="285" text-anchor="middle">Point-to-point OSPF adjacency, no DR election on R1 when priority is 0</text>
</svg>
