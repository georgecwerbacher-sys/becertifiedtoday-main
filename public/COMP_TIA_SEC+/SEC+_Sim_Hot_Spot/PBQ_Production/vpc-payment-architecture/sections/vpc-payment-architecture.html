<meta name="robots" content="noindex, nofollow" />
<article class="pbq-section-fragment" data-id="vpc-payment-architecture">

  <div class="pbq-vpc-payment-wrap">
<div class="sim-frame">
      <div
        class="vpc-diagram"
        role="group"
        aria-label="VPC payment application network diagram with component placement menus"
      >
        <img
          class="vpc-diagram-img"
          src="/COMP_TIA_SEC+/SEC+_Sim_Hot_Spot/images/vpc-payment-architecture.png"
          width="966"
          height="516"
          alt="VPC diagram with public subnet, private subnet, Internet Gateway, and placement boxes for payment application components"
          decoding="async"
        />
        <div class="vpc-node n2">
          <div class="vpc-slot" data-for="vpc-2"></div>
          <select class="vpc-select-native" id="vpc-2" aria-label="Diagram node 2 — top tier" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n1">
          <div class="vpc-slot" data-for="vpc-1"></div>
          <select class="vpc-select-native" id="vpc-1" aria-label="Diagram node 1 — public subnet left" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n3">
          <div class="vpc-slot" data-for="vpc-3"></div>
          <select class="vpc-select-native" id="vpc-3" aria-label="Diagram node 3 — public subnet right" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n4">
          <div class="vpc-slot" data-for="vpc-4"></div>
          <select class="vpc-select-native" id="vpc-4" aria-label="Diagram node 4 — middle tier" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="subnet-picker">
          <label>Middle tier subnet type</label>
          <select id="vpc-subnet" aria-label="Middle tier subnet type">
            <option value="">Select</option>
            <option>Public subnet</option>
            <option>Private subnet</option>
          </select>
        </div>
        <div class="vpc-node n5">
          <div class="vpc-slot" data-for="vpc-5"></div>
          <select class="vpc-select-native" id="vpc-5" aria-label="Diagram node 5 — private tier left" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n8">
          <div class="vpc-slot" data-for="vpc-8"></div>
          <select class="vpc-select-native" id="vpc-8" aria-label="Diagram node 8 — private tier center" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n6">
          <div class="vpc-slot" data-for="vpc-6"></div>
          <select class="vpc-select-native" id="vpc-6" aria-label="Diagram node 6 — private tier right" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
        <div class="vpc-node n7">
          <div class="vpc-slot" data-for="vpc-7"></div>
          <select class="vpc-select-native" id="vpc-7" aria-label="Diagram node 7 — database tier" tabindex="-1">
            <option value="">Select</option>
            <option>Autoscaling Instance</option>
            <option>Database</option>
            <option>Instance</option>
            <option>Load Balancer</option>
            <option>WAF</option>
          </select>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="checkBtn" type="button">Check Answers</button>
      <button id="resetBtn" class="secondary" type="button">Reset</button>
      <button id="showAnswerBtn" class="secondary" type="button">Show Answer</button>
    </div>
    <div id="resultBox" class="result" aria-live="polite"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </div>
</article>
<script>
(function () {
  var root = document.getElementById("vpc-payment-architecture");
  if (!root) return;

  function field(shortId) {
    return root.querySelector('[id$="-' + shortId + '"]');
  }

var NODE_ANSWERS = {
      "vpc-1": "Load Balancer",
      "vpc-2": "WAF",
      "vpc-3": "Load Balancer",
      "vpc-4": "Autoscaling Instance",
      "vpc-5": "Instance",
      "vpc-6": "Instance",
      "vpc-7": "Database"
    };

    var SUBNET_ANSWER = "Private subnet";

    function checkDiagram() {
      var missing = [];
      var wrong = [];
      Object.keys(NODE_ANSWERS).forEach((id) => {
        var el = field(id);
        var val = el.value;
        var label = id.replace("vpc-", "node ");
        if (!val) missing.push(label);
        else if (val !== NODE_ANSWERS[id]) wrong.push(label + " (expected " + NODE_ANSWERS[id] + ")");
      });
      var subnet = field("vpc-subnet");
      if (!subnet.value) missing.push("middle subnet");
      else if (subnet.value !== SUBNET_ANSWER) wrong.push("middle subnet (expected " + SUBNET_ANSWER + ")");
      return { missing, wrong };
    }

    function checkAnswers() {
      var { missing, wrong } = checkDiagram();
      var resultBox = root.querySelector("#resultBox");
      var feedback = root.querySelector("#feedback");

      if (missing.length) {
        resultBox.className = "result fail";
        resultBox.textContent = "Complete every component placement and the middle subnet selection.";
        feedback.textContent = "Missing: " + missing.join(", ") + ".";
        return;
      }

      var passed = wrong.length === 0;
      resultBox.className = "result " + (passed ? "pass" : "fail");
      resultBox.textContent = passed
        ? "Correct. The diagram places edge protection, redundant load balancing, scalable app tiers, and an isolated database."
        : "Not quite. Review WAF placement, public vs private tiers, and where payment data should live.";

      if (!passed) {
        feedback.textContent = "Review: " + wrong.join("; ") + ".";
      } else {
        feedback.textContent =
          "WAF at the top filters Internet Gateway traffic. Redundant load balancers sit in the public subnet. " +
          "Autoscaling Instance supports the app tier in a private middle subnet with Instance nodes. Database stays in the private subnet with no direct internet access.";
      }
    }

    function resetAnswers() {
      root.querySelectorAll(".vpc-select-native, [id$=\"-vpc-subnet\"]").forEach((el) => {
        el.selectedIndex = 0;
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      root.querySelector("#resultBox").className = "result";
      root.querySelector("#resultBox").textContent = "";
      root.querySelector("#feedback").textContent = "";
    }

    function showAnswers() {
      Object.keys(NODE_ANSWERS).forEach((id) => {
        var el = field(id);
        el.value = NODE_ANSWERS[id];
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      field("vpc-subnet").value = SUBNET_ANSWER;
      root.querySelector("#resultBox").className = "result pass";
      root.querySelector("#resultBox").textContent = "Answers shown. Review the architecture, then Reset to practice again.";
      root.querySelector("#feedback").textContent =
        "Node 2: WAF | Nodes 1 & 3: Load Balancer | Node 4: Autoscaling Instance | Nodes 5 & 6: Instance | Node 7: Database | Middle tier: Private subnet.";
    }

    var COMPONENT_ICONS = {
      "Autoscaling Instance":
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#f97316" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="#f97316" stroke-width="2"/></svg>',
      Database:
        '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" fill="#f97316"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" fill="none" stroke="#f97316" stroke-width="2"/><ellipse cx="12" cy="12" rx="7" ry="3" fill="none" stroke="#f97316" stroke-width="2"/></svg>',
      Instance:
        '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="#f97316"/></svg>',
      "Load Balancer":
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#f97316" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#f97316" stroke-width="2"/></svg>',
      WAF:
        '<img src="/COMP_TIA_SEC+/SEC+_Sim_Hot_Spot/images/firewall-brick.png" alt="" width="20" height="20" />',
    };

    function iconHtml(value) {
      return COMPONENT_ICONS[value] || "";
    }

    function closeAllVpcMenus(except) {
      root.querySelectorAll(".vpc-slot-menu").forEach((menu) => {
        if (menu !== except) {
          menu.hidden = true;
          var btn = menu.previousElementSibling;
          if (btn) btn.setAttribute("aria-expanded", "false");
        }
      });
    }

    function syncVpcSlot(select) {
      var slot = select.parentElement.querySelector(".vpc-slot");
      if (!slot) return;
      var btn = slot.querySelector(".vpc-slot-btn");
      var icon = slot.querySelector(".vpc-slot-icon");
      var label = slot.querySelector(".vpc-slot-label");
      var value = select.value;
      slot.classList.toggle("has-value", !!value);
      if (icon) icon.innerHTML = value ? iconHtml(value) : "";
      if (label) label.textContent = value || "Select";
    }

    function initVpcSlots() {
      root.querySelectorAll(".vpc-slot").forEach((slot) => {
        var selectId = slot.getAttribute("data-for");
        var select = field(selectId);
        if (!select) return;

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "vpc-slot-btn";
        btn.setAttribute("aria-haspopup", "listbox");
        btn.setAttribute("aria-expanded", "false");
        btn.innerHTML =
          '<span class="vpc-slot-icon"></span><span class="vpc-slot-label">Select</span>';

        var menu = document.createElement("ul");
        menu.className = "vpc-slot-menu";
        menu.setAttribute("role", "listbox");
        menu.hidden = true;

        Array.from(select.options).forEach((opt) => {
          if (!opt.value) return;
          var li = document.createElement("li");
          var item = document.createElement("button");
          item.type = "button";
          item.className = "vpc-slot-option";
          item.setAttribute("role", "option");
          item.dataset.value = opt.value;
          item.innerHTML =
            '<span class="vpc-slot-icon">' +
            iconHtml(opt.value) +
            '</span><span class="vpc-slot-label">' +
            opt.value +
            "</span>";
          item.addEventListener("click", () => {
            select.value = opt.value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            syncVpcSlot(select);
            menu.hidden = true;
            btn.setAttribute("aria-expanded", "false");
          });
          li.appendChild(item);
          menu.appendChild(li);
        });

        slot.appendChild(btn);
        slot.appendChild(menu);

        btn.addEventListener("click", () => {
          var open = menu.hidden;
          closeAllVpcMenus(open ? menu : null);
          menu.hidden = !open;
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        });

        select.addEventListener("change", () => syncVpcSlot(select));
        syncVpcSlot(select);
      });

      root.addEventListener("click", function (ev) {
        if (!ev.target.closest(".vpc-slot")) closeAllVpcMenus(null);
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") closeAllVpcMenus(null);
      });
    }

    initVpcSlots();

    root.querySelector("#checkBtn").addEventListener("click", checkAnswers);
    root.querySelector("#resetBtn").addEventListener("click", resetAnswers);
    root.querySelector("#showAnswerBtn").addEventListener("click", showAnswers);
})();
</script>
