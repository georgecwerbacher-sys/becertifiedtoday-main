<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in | Be Certified Today</title>
  <link rel="icon" href="/images/logo/becertifiedtoday_logo_trans.png" type="image/png" />
  <link rel="stylesheet" href="/account/account.css" />
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Learner account</p>
    <h1>Sign in with email</h1>
    <p>
      Free accounts track results across CCNA, ENCOR, Security+, and CCNAAUTO. Full question banks still require
      paid portal access for each track.
    </p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="320" placeholder="you@example.com" />
      <div class="actions">
        <button type="submit" class="btn-primary">Email me a sign-in link</button>
        <a class="btn-secondary" href="/account/">Back to account</a>
      </div>
      <p id="status" class="status" hidden></p>
    </form>
    <p class="fine">
      We use a one-time email link—no password. Portal unlock stays separate after purchase.
    </p>
  </div>
  <script src="/js/bcc-learner-account.js" defer></script>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var status = document.getElementById("status");
      var emailInput = document.getElementById("email");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        status.hidden = false;
        status.className = "status";
        status.textContent = "Sending…";
        window.BCC_LEARNER.requestLogin((emailInput.value || "").trim()).then(function (res) {
          if (res.ok && res.data && res.data.ok) {
            status.className = "status status--ok";
            status.textContent = res.data.message || "Check your email for the sign-in link.";
            return;
          }
          status.className = "status status--err";
          status.textContent =
            (res.data && res.data.error) ||
            "Could not send the link. Try again in a minute.";
          if (res.data && res.data.hint) status.textContent += " " + res.data.hint;
        });
      });
    })();
  </script>
</body>
</html>
