  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --bcc-outside-text: #1a3d6e;
      --bcc-choice-bg: #254b8a;
      --bcc-choice-border: #3d6dbb;
      --bcc-box-text: #e6edf3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: var(--bcc-outside-text);
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: min(900px, 100%);
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--bcc-outside-text);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      line-height: 1.35;
      color: var(--bcc-outside-text);
    }
    .pipeline-exhibit {
      margin: 0 0 18px;
      padding: 18px 16px;
      border: 1px solid #c5d4e8;
      border-radius: 12px;
      background: #f7f9fc;
      overflow-x: auto;
    }
    .pipeline-exhibit__title {
      margin: 0 0 14px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      color: #1a3d6e;
    }
    .pipeline-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: min(100%, 720px);
    }
    .pipeline-stage {
      flex: 0 0 auto;
      min-width: 88px;
      padding: 10px 8px;
      border-radius: 8px;
      background: #254b8a;
      border: 1px solid #3d6dbb;
      color: #e6edf3;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }
    .pipeline-arrow {
      flex: 0 0 auto;
      color: #516f94;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0 2px;
    }
    .pipeline-caption {
      margin: 14px 0 0;
      font-size: 0.85rem;
      text-align: center;
      color: #516f94;
    }
    .choice {
      display: block;
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bcc-choice-bg);
      border: 1px solid var(--bcc-choice-border);
      font-size: 1.02rem;
      color: var(--bcc-box-text);
      cursor: pointer;
    }
    .choice input {
      margin-right: 10px;
      transform: translateY(1px);
    }
    .answer-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .answer-actions,
    .answer-side-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-check,
    .nav-show-answer {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: #1f4f93;
    }
    .nav-show-answer {
      background: #31516f;
    }
    .question-topic-meta {
      margin: 0;
      color: #516f94;
      font-size: 0.9rem;
    }
    .question-topic-meta__version,
    .question-topic-meta__subject {
      display: inline-block;
      margin-right: 8px;
    }
    .answer {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
      line-height: 1.45;
    }
    .answer.correct {
      background: #113e2d;
      border: 1px solid #1f7a58;
      color: #ffffff;
    }
    .answer.incorrect {
      background: #442020;
      border: 1px solid #8c3434;
      color: #fecaca;
    }
  </style>
  <link rel="stylesheet" href="/CCNAAUTO-Study/css/ccnaauto-question-page.css" />
</head>
<body class="ccnaauto-question-ui">
  <script src="/js/sample-url-mask-apply.js"></script>
  <div class="page-logo-watermark" aria-hidden="true">
    <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
  </div>
  <main class="card">
    <nav class="question-nav" aria-label="Question navigation">
      <div class="question-nav-links">
        <a class="nav-link nav-prev" href="/CCNAAUTO-Study/CCNAAUTO_Questions/model-driven-programmability-benefits-choose-two.html">Back</a>
        <a class="nav-link nav-home" href="/ccnaauto-home.html">Home</a>
        <a class="nav-link nav-next next-link" href="/CCNAAUTO-Study/CCNAAUTO_Questions/rest-api-retry-after-rate-limit.html">Next</a>
      </div>
    </nav>

    <h1>Refer to the exhibit. Which infrastructure automation method is shown?</h1>

    <figure class="pipeline-exhibit" aria-label="Automated pipeline stages from commit through deployment">
      <p class="pipeline-exhibit__title">Infrastructure automation workflow</p>
      <div class="pipeline-flow">
        <div class="pipeline-stage">Commit<br />code</div>
        <span class="pipeline-arrow" aria-hidden="true">→</span>
        <div class="pipeline-stage">Build</div>
        <span class="pipeline-arrow" aria-hidden="true">→</span>
        <div class="pipeline-stage">Automated<br />test</div>
        <span class="pipeline-arrow" aria-hidden="true">→</span>
        <div class="pipeline-stage">Deploy to<br />staging</div>
        <span class="pipeline-arrow" aria-hidden="true">→</span>
        <div class="pipeline-stage">Deploy to<br />production</div>
      </div>
      <p class="pipeline-caption">Each stage runs automatically when changes are committed to version control.</p>
    </figure>

    <label class="choice"><input type="radio" name="ccnaauto_q122" value="A" />A. Waterfall</label>
    <label class="choice"><input type="radio" name="ccnaauto_q122" value="B" />B. CI/CD pipeline</label>
    <label class="choice"><input type="radio" name="ccnaauto_q122" value="C" />C. Agile</label>
    <label class="choice"><input type="radio" name="ccnaauto_q122" value="D" />D. Lean</label>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">5.4 CI/CD pipeline in infrastructure automation</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT = "B";
      var CORRECT_MSG =
        "Correct. B - The exhibit shows an automated sequence of build, test, and deployment stages triggered by code commits. That workflow is a CI/CD pipeline. Waterfall and Agile are software development methodologies, and Lean focuses on eliminating waste rather than automated delivery stages.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q122"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q122"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
</body>
