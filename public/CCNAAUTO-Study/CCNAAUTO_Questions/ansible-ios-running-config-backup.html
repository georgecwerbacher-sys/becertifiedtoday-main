    <h1>What is the effect of this Ansible playbook on an IOS router?</h1>

    <figure class="ccnaauto-code-exhibit" aria-label="Ansible playbook exhibit">
      <p class="ccnaauto-code-exhibit__label">Exhibit · Ansible playbook</p>
      <div class="ccnaauto-code-window">
        <div class="ccnaauto-code-window__titlebar" aria-hidden="true">
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--close"></span>
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--minimize"></span>
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--maximize"></span>
        </div>
        <div class="ccnaauto-code-window__body">
          <div class="ccnaauto-code-window__logo" aria-hidden="true">
            <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
          </div>
          <pre class="ccnaauto-code-window__pre ccnaauto-code-window__pre--yaml ccnaauto-code-window__pre--linenumbers"><code><span class="line"><span class="yaml-list">---</span></span>
<span class="line"><span class="yaml-list">- </span><span class="yaml-key">hosts</span><span class="yaml-list">: </span><span class="yaml-var">{{ router }}</span></span>
<span class="line">  <span class="yaml-key">gather_facts</span><span class="yaml-list">: </span><span class="yaml-str">true</span></span>
<span class="line">  <span class="yaml-key">connection</span><span class="yaml-list">: </span><span class="yaml-str">local</span></span>
<span class="line"> </span>
<span class="line">  <span class="yaml-key">tasks</span><span class="yaml-list">:</span></span>
<span class="line">    <span class="yaml-list">- </span><span class="yaml-key">ios_command</span><span class="yaml-list">:</span></span>
<span class="line">        <span class="yaml-key">commands</span><span class="yaml-list">:</span></span>
<span class="line">          <span class="yaml-list">- </span><span class="yaml-str">show run</span></span>
<span class="line">        <span class="yaml-key">provider</span><span class="yaml-list">: </span><span class="yaml-str">"{{ router_credentials }}"</span></span>
<span class="line">        <span class="yaml-key">register</span><span class="yaml-list">: </span><span class="yaml-str">config</span></span>
<span class="line"> </span>
<span class="line">    <span class="yaml-list">- </span><span class="yaml-key">copy</span><span class="yaml-list">:</span></span>
<span class="line">        <span class="yaml-key">content</span><span class="yaml-list">: </span><span class="yaml-str">"{{ config.stdout[0] }}"</span></span>
<span class="line">        <span class="yaml-key">dest</span><span class="yaml-list">: </span><span class="yaml-str">"/etc/ansible/configs/command_{{ router_hostname }}.txt"</span></span>
<span class="line"><span class="yaml-list">...</span></span></code></pre>
        </div>
      </div>
    </figure>

    <label class="choice"><input type="radio" name="ccnaauto_q25" value="A" />A. A new running configuration is pushed to the IOS router.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q25" value="B" />B. The current running configuration of the IOS router is backed up.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q25" value="C" />C. The start-up configuration of the IOS router is copied to a local folder.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q25" value="D" />D. A new start-up configuration is copied to the IOS router.</label>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">5.8 Ansible playbook workflow</span>
        </p>
      </div>

        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT = "B";
      var CORRECT_MSG =
        "Correct. B - The ios_command task runs show run on the router and registers the output. The copy task writes that output to a local file on the Ansible control node, which backs up the current running configuration. Nothing is pushed to the router and startup-config is not involved.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q25"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q25"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
