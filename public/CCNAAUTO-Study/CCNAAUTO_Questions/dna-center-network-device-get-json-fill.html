<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>CCNAAUTO - Cisco DNA Center network device API fill-in | Be Certified Today</title>
  <link rel="stylesheet" href="/css/bcc-question-link-nav.css" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --bcc-outside-text: #1a3d6e;
      --bcc-choice-bg: #254b8a;
      --bcc-choice-border: #3d6dbb;
      --bcc-box-text: #e6edf3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: var(--bcc-outside-text);
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: min(980px, 100%);
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--bcc-outside-text);
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      line-height: 1.35;
      color: var(--bcc-outside-text);
    }
    .statement-card {
      margin: 18px 0;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #c8d7ea;
      background: #f7fbff;
      box-shadow: 0 10px 30px rgba(18, 45, 76, 0.08);
    }
    .statement {
      margin: 0;
      color: #173b6d;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.9;
    }
    .blank-select {
      min-width: 10ch;
      margin: 0 4px;
      padding: 6px 8px;
      border: 0;
      border-bottom: 3px solid #294f87;
      background: #ffffff;
      color: #173b6d;
      font: inherit;
      font-weight: 800;
      text-align: center;
      outline: none;
      border-radius: 6px 6px 0 0;
    }
    .blank-select:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .endpoint {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.95em;
      white-space: nowrap;
    }
    .answer-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .answer-actions,
    .answer-side-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-check,
    .nav-show-answer {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: #1f4f93;
    }
    .nav-show-answer {
      background: #31516f;
    }
    .question-topic-meta {
      margin: 0;
      color: #516f94;
      font-size: 0.9rem;
    }
    .question-topic-meta__version,
    .question-topic-meta__subject {
      display: inline-block;
      margin-right: 8px;
    }
    .answer {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
      line-height: 1.45;
    }
    .answer.correct {
      background: #113e2d;
      border: 1px solid #1f7a58;
      color: #ffffff;
    }
    .answer.incorrect {
      background: #442020;
      border: 1px solid #8c3434;
      color: #fecaca;
    }
  </style>
  <link rel="stylesheet" href="/CCNAAUTO-Study/css/ccnaauto-question-page.css" />
</head>
<body class="ccnaauto-question-ui">
  <script src="/js/sample-url-mask-apply.js"></script>
  <div class="page-logo-watermark" aria-hidden="true">
    <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
  </div>
  <main class="card">
    <nav class="question-nav" aria-label="Question navigation">
      <div class="question-nav-links">
        <a class="nav-link nav-prev" href="/CCNAAUTO-Study/CCNAAUTO_Questions/code-review-before-merge.html">Back</a>
        <a class="nav-link nav-home" href="/ccnaauto-home.html">Home</a>
        <a class="nav-link nav-next next-link" href="/CCNAAUTO-Study/CCNAAUTO_Questions/topology-subnet-serial-statements-choose-two.html">Next</a>
      </div>
    </nav>

    <h1>Fill in the blanks to complete the statement.</h1>

    <section class="statement-card" aria-label="Cisco DNA Center API statement">
      <p class="statement">
        Cisco DNA Center provides the capability to send an HTTP
        <select id="methodBlank" class="blank-select" aria-label="HTTP method">
          <option value="">select</option>
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
        request to the API endpoint
        <span class="endpoint">https://DNA-c_API_ADDRESS/api/v1/network-device/</span>
        and receive the network
        <select id="listBlank" class="blank-select" aria-label="Network list type">
          <option value="">select</option>
          <option value="client">client</option>
          <option value="device">device</option>
          <option value="event">event</option>
          <option value="site">site</option>
        </select>
        list in
        <select id="formatBlank" class="blank-select" aria-label="Response format">
          <option value="">select</option>
          <option value="CSV">CSV</option>
          <option value="JSON">JSON</option>
          <option value="XML">XML</option>
          <option value="YAML">YAML</option>
        </select>
        format.
      </p>
    </section>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">3.9.a Cisco API device inventory</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var methodBlank = document.getElementById("methodBlank");
      var listBlank = document.getElementById("listBlank");
      var formatBlank = document.getElementById("formatBlank");
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");
      var CORRECT_MSG =
        "Correct. Cisco DNA Center/Catalyst Center uses an HTTP GET request to retrieve the network device list, and API responses are returned in JSON format.";

      function clean(value) {
        return String(value || "").trim().toLowerCase();
      }

      function isCorrect() {
        var method = clean(methodBlank.value);
        var listType = clean(listBlank.value);
        var format = clean(formatBlank.value);
        return method === "get" && (listType === "device" || listType === "devices") && format === "json";
      }

      checkBtn.addEventListener("click", function () {
        answerBox.style.display = "block";
        if (!methodBlank.value || !listBlank.value || !formatBlank.value) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Choose an option for all three blanks.";
          return;
        }
        if (isCorrect()) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent =
            "Incorrect. Use GET for the request method, device for the network list, and JSON for the response format.";
        }
      });

      showBtn.addEventListener("click", function () {
        methodBlank.value = "GET";
        listBlank.value = "device";
        formatBlank.value = "JSON";
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
</body>
</html>
