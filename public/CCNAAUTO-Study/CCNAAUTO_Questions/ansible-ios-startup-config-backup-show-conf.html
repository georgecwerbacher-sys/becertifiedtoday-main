    <h1>Refer to the exhibit. What is the result of executing this Ansible playbook?</h1>

    <figure class="ccnaauto-code-exhibit" aria-label="Ansible startup configuration backup exhibit">
      <p class="ccnaauto-code-exhibit__label">Exhibit · Ansible playbook</p>
      <div class="ccnaauto-code-window">
        <div class="ccnaauto-code-window__titlebar" aria-hidden="true">
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--close"></span>
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--minimize"></span>
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--maximize"></span>
        </div>
        <div class="ccnaauto-code-window__body">
          <div class="ccnaauto-code-window__logo" aria-hidden="true">
            <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
          </div>
          <pre class="ccnaauto-code-window__pre ccnaauto-code-window__pre--yaml"><code>---
- hosts: CISCO_ROUTER_01
  gather_facts: true
  connection: network_cli

  tasks:
    - name: show conf
      ios_command:
        commands:
          - show conf
      register: config

    - name: save output to /etc/ansible/configs
      copy:
        content: "{{ config.stdout[0] }}"
        dest: "/etc/ansible/configs/show_conf_{{ inventory_hostname }}.txt"</code></pre>
        </div>
      </div>
    </figure>

    <label class="choice"><input type="radio" name="ccnaauto_q91" value="A" />A. The playbook copies a new start-up configuration to CISCO_ROUTER_01.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q91" value="B" />B. The playbook backs up the running configuration of CISCO_ROUTER_01.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q91" value="C" />C. The playbook backs up the start-up configuration of CISCO_ROUTER_01.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q91" value="D" />D. The playbook copies a new running configuration to CISCO_ROUTER_01.</label>

    <div class="answer-footer">

          <span class="question-topic-meta__subject">5.8 Ansible playbook workflow</span>

  <script>
    (function () {
      var CORRECT = "C";
      var CORRECT_MSG =
        "Correct. C - The ios_command task runs show conf and registers the output. The copy task writes that captured output to a local file on the Ansible control node, so the playbook backs up the startup configuration rather than pushing a new configuration to the router.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q91"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q91"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
