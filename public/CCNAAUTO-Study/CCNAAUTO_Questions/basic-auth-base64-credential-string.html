    <h1>Fill in the blanks to complete the statement.</h1>

    <p class="statement">
      Given a username of &ldquo;devnet&rdquo; and a password &ldquo;Cisco123&rdquo;, applications must create a base64
      encoding of the string &ldquo;
      <input id="credentialBlank" class="blank-input blank-input--credential" type="text" autocomplete="off" spellcheck="false" aria-label="Basic authentication source string" />
      &rdquo; when sending HTTP requests to an API that uses
      <input id="authBlank" class="blank-input" type="text" autocomplete="off" spellcheck="false" aria-label="Authentication type" />
      authentication.
    </p>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">2.7 Basic authentication</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT_CREDENTIAL = "devnet:Cisco123";
      var CORRECT_AUTH = "Basic";
      var CORRECT_MSG =
        "Correct. Basic authentication combines the username and password as " +
        CORRECT_CREDENTIAL +
        " before base64 encoding the string for the Authorization header.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");
      var credentialBlank = document.getElementById("credentialBlank");
      var authBlank = document.getElementById("authBlank");

      function normalize(value) {
        return String(value || "").trim();
      }

      function showCorrect() {
        credentialBlank.value = CORRECT_CREDENTIAL;
        authBlank.value = CORRECT_AUTH;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.innerHTML = CORRECT_MSG.replace(CORRECT_CREDENTIAL, "<code>" + CORRECT_CREDENTIAL + "</code>");
      }

      checkBtn.addEventListener("click", function () {
        var credentialValue = normalize(credentialBlank.value);
        var authValue = normalize(authBlank.value);
        answerBox.style.display = "block";
        if (!credentialValue || !authValue) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Fill in both blanks.";
          return;
        }
        if (credentialValue === CORRECT_CREDENTIAL && authValue.toLowerCase() === CORRECT_AUTH.toLowerCase()) {
          showCorrect();
        } else {
          answerBox.className = "answer incorrect";
          answerBox.innerHTML =
            "Incorrect. The source string is <code>" +
            CORRECT_CREDENTIAL +
            "</code>, and the authentication type is <code>" +
            CORRECT_AUTH +
            "</code>.";
        }
      });

      showBtn.addEventListener("click", showCorrect);
    })();
  </script>
