<body class="ccnaauto-question-ui">

    <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />

    <nav class="question-nav" aria-label="Question navigation">
      <div class="question-nav-links">

    <h1>Which REST architectural constraint indicates that no client context should be stored on the server between requests?</h1>

    <label class="choice"><input type="radio" name="ccnaauto_q1" value="A" />A. Stateless</label>
    <label class="choice"><input type="radio" name="ccnaauto_q1" value="B" />B. Uniform interface</label>
    <label class="choice"><input type="radio" name="ccnaauto_q1" value="C" />C. Cacheable</label>
    <label class="choice"><input type="radio" name="ccnaauto_q1" value="D" />D. Client-server</label>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">2.3 Understanding and Using APIs</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT = "A";
      var CORRECT_MSG =
        "Correct. A - The REST stateless constraint means the server does not store client context between requests. Each request must carry the information the server needs to process it. Uniform interface standardizes resource interactions, cacheable allows responses to be reused when appropriate, and client-server separates client and server responsibilities.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q1"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q1"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
