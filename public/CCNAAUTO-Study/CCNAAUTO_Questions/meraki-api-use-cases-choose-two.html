    <h1>Which two use cases are supported by Meraki APIs? (Choose two.)</h1>

    <label class="choice"><input type="checkbox" name="ccnaauto_q62" value="A" />A. Retrieve live streams from a Meraki Camera.</label>
    <label class="choice"><input type="checkbox" name="ccnaauto_q62" value="B" />B. Build a custom Captive Portal for Mobile Apps.</label>
    <label class="choice"><input type="checkbox" name="ccnaauto_q62" value="C" />C. Configure network devices via the Dashboard API.</label>
    <label class="choice"><input type="checkbox" name="ccnaauto_q62" value="D" />D. Build location-aware apps from Wi-Fi and LoRaWAN devices.</label>
    <label class="choice"><input type="checkbox" name="ccnaauto_q62" value="E" />E. Deploy applications onto the devices.</label>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">3.2 Meraki platform APIs</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT = ["B", "C"];
      var CORRECT_MSG =
        "Correct. B and C - Meraki supports custom captive portal integrations and the Dashboard API for programmatic network/device configuration. Meraki location APIs use Wi-Fi and BLE data, not LoRaWAN in this use case.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function selectedValues() {
        return Array.prototype.slice
          .call(document.querySelectorAll('input[name="ccnaauto_q62"]:checked'))
          .map(function (input) {
            return input.value;
          })
          .sort();
      }

      function isCorrect(values) {
        return values.length === CORRECT.length && values.every(function (value, idx) {
          return value === CORRECT[idx];
        });
      }

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var values = selectedValues();
        answerBox.style.display = "block";
        if (!values.length) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select two answers.";
          return;
        }
        if (isCorrect(values)) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        document.querySelectorAll('input[name="ccnaauto_q62"]').forEach(function (input) {
          input.checked = CORRECT.indexOf(input.value) !== -1;
        });
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
