    <h1>Refer to the exhibit. What is the action of the Bash script that is shown?</h1>

    <div class="exhibit-wrap">
      <div class="ccnaauto-code-window" aria-label="Bash script exhibit">
        <div class="ccnaauto-code-window__titlebar" aria-hidden="true">
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--close"></span>
          <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--minimize"></span>

        </div>

          <div class="ccnaauto-code-window__logo" aria-hidden="true">
            <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
          </div>
          <pre class="ccnaauto-code-window__pre ccnaauto-code-window__pre--shell"><code><span class="sh-comment">#!/bin/bash</span>
<span class="sh-cmd">read</span> <span class="sh-var">ndir</span>
<span class="sh-cmd">while</span> <span class="sh-punct">[</span> <span class="sh-flag">-d</span> <span class="sh-str">"$ndir"</span> <span class="sh-punct">]</span>
<span class="sh-cmd">do</span>
  <span class="sh-cmd">cd</span> <span class="sh-var">$ndir</span>
<span class="sh-cmd">done</span>
<span class="sh-cmd">mkdir</span> <span class="sh-var">$ndir</span></code></pre>
        </div>
      </div>

    <label class="choice"><input type="radio" name="ccnaauto_q43" value="A" />A. The script waits until input is entered. If the directory exists, the script goes into it until there is no directory with the same name, then it creates a new directory.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q43" value="B" />B. The script goes into the directory called "$ndir" and makes a new directory called "$ndir".</label>
    <label class="choice"><input type="radio" name="ccnaauto_q43" value="C" />C. The script waits until input is entered, then it goes into the directory entered and creates a new directory with the same name.</label>
    <label class="choice"><input type="radio" name="ccnaauto_q43" value="D" />D. For all directories in the current folder, the script goes into each directory and makes a new directory.</label>

    <div id="answerBox" class="answer" aria-live="polite"></div>

  <script>
    (function () {
      var CORRECT = "A";
      var CORRECT_MSG =
        "Correct. A - The script reads a directory name, repeatedly enters existing child directories with that name, and creates that directory once it reaches a level where it does not already exist.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q43"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q43"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
