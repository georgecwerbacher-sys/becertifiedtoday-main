<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />

  <title>CCNAAUTO - OWASP cross-site scripting exhibit | Be Certified Today</title>
  <link rel="stylesheet" href="/css/bcc-question-link-nav.css" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --bcc-outside-text: #1a3d6e;
      --bcc-choice-bg: #254b8a;
      --bcc-choice-border: #3d6dbb;
      --bcc-box-text: #e6edf3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: var(--bcc-outside-text);
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: min(900px, 100%);
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--bcc-outside-text);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      line-height: 1.35;
      color: var(--bcc-outside-text);
    }
    .exhibit-wrap {
      margin: 0 0 16px;
      text-align: center;
    }
    .exhibit-wrap img {
      max-width: 100%;
      height: auto;
      border: 1px solid #c5d4e8;
      border-radius: 8px;
    }
    .choice {
      display: block;
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bcc-choice-bg);
      border: 1px solid var(--bcc-choice-border);
      font-size: 1.02rem;
      color: var(--bcc-box-text);
      cursor: pointer;
    }
    .choice input {
      margin-right: 10px;
      transform: translateY(1px);
    }
    .answer-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .answer-actions,
    .answer-side-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-check,
    .nav-show-answer {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: #1f4f93;
    }
    .nav-show-answer {
      background: #31516f;
    }
    .question-topic-meta {
      margin: 0;
      color: #516f94;
      font-size: 0.9rem;
    }
    .question-topic-meta__version,
    .question-topic-meta__subject {
      display: inline-block;
      margin-right: 8px;
    }
    .answer {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
      line-height: 1.45;
    }
    .answer.correct {
      background: #113e2d;
      border: 1px solid #1f7a58;
      color: #ffffff;
    }
    .answer.incorrect {
      background: #442020;
      border: 1px solid #8c3434;
      color: #fecaca;
    }
  </style>
  <link rel="stylesheet" href="/CCNAAUTO-Study/css/ccnaauto-question-page.css" />
</head>
<body class="ccnaauto-question-ui">
  <script src="/js/sample-url-mask-apply.js"></script>
  <div class="page-logo-watermark" aria-hidden="true">
    <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
  </div>
  <main class="card">
    <nav class="question-nav" aria-label="Question navigation">
      <div class="question-nav-links">
        <a class="nav-link nav-prev" href="/CCNAAUTO-Study/CCNAAUTO_Questions/ios-xe-configuration-change-protocols-choose-two.html">Back</a>
        <a class="nav-link nav-home" href="/ccnaauto-home.html">Home</a>
        <a class="nav-link nav-next next-link" href="/CCNAAUTO-Study/CCNAAUTO_Questions/bash-rm-rf-delete-directory-recursive.html">Next</a>
      </div>
    </nav>

    <h1>Refer to the exhibit. Which OWASP threat does this example demonstrate?</h1>

    <figure class="exhibit-wrap">
      <img
        src="/CCNAAUTO-Study/CCNAAUTO_Questions/images/owasp-xss-url-script-alert.png"
        alt="Browser window with a URL containing a script tag in the user query parameter and a JavaScript alert dialog"
      />
    </figure>

    <label class="choice"><input type="radio" name="ccnaauto_q108" value="A" />A. broken access control</label>
    <label class="choice"><input type="radio" name="ccnaauto_q108" value="B" />B. SQL injection</label>
    <label class="choice"><input type="radio" name="ccnaauto_q108" value="C" />C. man-in-the-middle</label>
    <label class="choice"><input type="radio" name="ccnaauto_q108" value="D" />D. cross-site scripting</label>

    <div class="answer-footer">
      <div class="answer-actions">
        <button id="checkBtn" type="button" class="nav-check">Check answer</button>
        <p class="question-topic-meta">
          <span class="question-topic-meta__version">200-901 v1.1</span>
          <span class="question-topic-meta__subject">4.10 OWASP threats</span>
        </p>
      </div>
      <div class="answer-side-actions">
        <button id="showBtn" type="button" class="nav-show-answer">Show Answer</button>
      </div>
    </div>

    <div id="answerBox" class="answer" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var CORRECT = "D";
      var CORRECT_MSG =
        "Correct. D - Cross-site scripting (XSS) occurs when untrusted input such as a script tag in a URL parameter is reflected back and executed in the victim's browser. SQL injection targets databases, broken access control bypasses authorization, and man-in-the-middle attacks intercept traffic between endpoints.";
      var checkBtn = document.getElementById("checkBtn");
      var showBtn = document.getElementById("showBtn");
      var answerBox = document.getElementById("answerBox");

      function incorrectMsg() {
        return "Incorrect. " + CORRECT_MSG.replace(/^Correct\.\s*/, "");
      }

      checkBtn.addEventListener("click", function () {
        var sel = document.querySelector('input[name="ccnaauto_q108"]:checked');
        answerBox.style.display = "block";
        if (!sel) {
          answerBox.className = "answer incorrect";
          answerBox.textContent = "Select an answer.";
          return;
        }
        if (sel.value === CORRECT) {
          answerBox.className = "answer correct";
          answerBox.textContent = CORRECT_MSG;
        } else {
          answerBox.className = "answer incorrect";
          answerBox.textContent = incorrectMsg();
        }
      });

      showBtn.addEventListener("click", function () {
        var input = document.querySelector('input[name="ccnaauto_q108"][value="' + CORRECT + '"]');
        if (input) input.checked = true;
        answerBox.style.display = "block";
        answerBox.className = "answer correct";
        answerBox.textContent = CORRECT_MSG;
      });
    })();
  </script>
</body>
</html>
