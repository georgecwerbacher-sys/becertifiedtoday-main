<!--
  CCNAAUTO code exhibit — copy into MCQ or D&D pages with a code block.

  1. Link stylesheet in <head>:
     <link rel="stylesheet" href="/CCNAAUTO-Study/css/ccnaauto-code-exhibit.css" />

  2. Pick one pre modifier (add --linenumbers for YAML/Ansible playbooks):
     ccnaauto-code-window__pre--python
     ccnaauto-code-window__pre--yaml
     ccnaauto-code-window__pre--shell
     ccnaauto-code-window__pre--json
     ccnaauto-code-window__pre--diff

  3. Page watermark (outside code): 12% opacity on .page-logo-watermark img
  4. In-code watermark: automatic at 4% inside .ccnaauto-code-window__body

  D&D fill-in: wrap script panel in .ccnaauto-code-dnd-layout on the layout row.
  Place pages under public/CCNAAUTO-Study/CCNAAUTO_Coding/
  See public/CCNAAUTO-Study/CCNAAUTO_Coding/dragdrop-dna-center-network-device-python-get.html
-->

<!-- MCQ exhibit (Ansible / Python / Bash / JSON / diff) -->
<figure class="ccnaauto-code-exhibit" aria-label="REPLACE: exhibit description">
  <p class="ccnaauto-code-exhibit__label">Exhibit · REPLACE: language label</p>
  <div class="ccnaauto-code-window">
    <div class="ccnaauto-code-window__titlebar" aria-hidden="true">
      <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--close"></span>
      <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--minimize"></span>
      <span class="ccnaauto-code-window__dot ccnaauto-code-window__dot--maximize"></span>
    </div>
    <div class="ccnaauto-code-window__body">
      <div class="ccnaauto-code-window__logo" aria-hidden="true">
        <img src="/images/logo/becertifiedtoday_logo_image_trans.png" alt="" />
      </div>
      <pre class="ccnaauto-code-window__pre ccnaauto-code-window__pre--python"><code>REPLACE: highlighted code</code></pre>
    </div>
  </div>
</figure>
